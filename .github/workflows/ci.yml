name: CI Quality Gate

on:
  push:
    branches:
      - development
      - main
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

jobs:
  quality:
    name: CI Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Component Tests
        run: pnpm build-storybook

      - name: Start API
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_KEY: ci-test-key
        run: |
          pnpm --dir services/api start > api.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi

            sleep 2
          done

          echo "API failed to start"
          cat api.log
          exit 1

      - name: Start Web
        run: |
          pnpm --dir apps/web preview --host 0.0.0.0 --port 5173 > web.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:5173/ > /dev/null; then
              echo "Web is ready"
              break
            fi
            sleep 2
          done

      - name: Unit Tests
        run: pnpm test:unit

      - name: Integration Tests
        run: pnpm test:integration

      - name: API Tests
        run: pnpm test:api

      - name: E2E Tests
        run: pnpm test:e2e

      - name: Performance Tests
        run: pnpm test:performance

      - name: Security Tests
        run: pnpm test:security

      - name: Analytics Tests
        run: pnpm test:analytics
