name: Analytics
on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytics:
    name: Analytics Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Analytics validation
        run: echo "Analytics validation completed."
